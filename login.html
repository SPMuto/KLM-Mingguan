<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — KLM Mingguan</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1f2937 0%,
                    #374151 50%,
                    #f97316 150%
                );
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 22px;

            padding: 38px 35px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.28);
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f97316,
                    #ea580c
                );

            color: #ffffff;

            font-size: 34px;
            font-weight: 900;

            box-shadow:
                0 10px 25px
                rgba(249, 115, 22, 0.3);
        }

        h1 {
            margin: 0;

            text-align: center;

            font-size: 25px;

            color: #111827;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #f9fafb;

            color: #111827;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            outline: none;

            border-color: #f97316;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(249, 115, 22, 0.12);
        }

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #f97316,
                    #ea580c
                );

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(249, 115, 22, 0.25);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #mesej {
            min-height: 22px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
            font-weight: 700;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .footer {
            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 30px 24px;
            }

            h1 {
                font-size: 22px;
            }

        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            KLM
        </div>

        <h1>KLM MINGGUAN</h1>

        <div class="subtitle">
            Sistem Pengisian KLM Mingguan
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    EMAIL PENGGUNA
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    KATA LALUAN
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan kata laluan"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                🔐 LOGIN
            </button>

        </form>

        <div id="mesej"></div>

        <div class="footer">
            KLM Mingguan
            <br>
            Ketua Unit
        </div>

    </div>

</div>


<script>

    // =====================================================
    // LOGIN
    // =====================================================

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const mesej =
        document.getElementById("mesej");


    // =====================================================
    // CHECK SUPABASE
    // =====================================================

    if (!window.supabaseClient) {

        mesej.textContent =
            "❌ Sambungan Supabase tidak tersedia.";

        mesej.className = "error";

        loginButton.disabled = true;

        console.error(
            "supabaseClient tidak dijumpai."
        );

    }


    // =====================================================
    // CHECK SESSION
    // Jika sudah login → terus ke KLM
    // =====================================================

    async function semakSession() {

        try {

            const {
                data,
                error
            } = await window.supabaseClient.auth.getSession();

            if (error) {

                console.error(
                    "SESSION ERROR:",
                    error
                );

                return;
            }

            if (data.session) {

                console.log(
                    "SESSION SUDAH ADA:",
                    data.session.user.email
                );

                window.location.href =
                    "klm-mingguan.html";
            }

        } catch (err) {

            console.error(
                "CHECK SESSION ERROR:",
                err
            );

        }

    }


    semakSession();


    // =====================================================
    // LOGIN SUBMIT
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                paparMesej(
                    "Sila masukkan email dan kata laluan.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "⏳ SEDANG LOGIN...";

            paparMesej(
                "Menyemak pengguna...",
                ""
            );


            try {

                const {
                    data,
                    error
                } =
                await window.supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    paparMesej(
                        "❌ Email atau kata laluan tidak sah.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "🔐 LOGIN";

                    return;
                }


                if (!data.session) {

                    paparMesej(
                        "❌ Session login tidak berjaya.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "🔐 LOGIN";

                    return;
                }

                console.log(
                    "LOGIN BERJAYA:",
                    data.user.email
                );


                paparMesej(
                    "✅ Login berjaya. Membuka sistem...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "klm-mingguan.html";

                    },
                    500
                );


            } catch (err) {

                console.error(
                    "LOGIN EXCEPTION:",
                    err
                );

                paparMesej(
                    "❌ Berlaku ralat semasa login.",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 LOGIN";
            }

        }
    );


    // =====================================================
    // MESEJ
    // =====================================================

    function paparMesej(
        text,
        type
    ) {

        mesej.textContent = text;

        mesej.className = type || "";

    }

</script>

</body>

</html>
